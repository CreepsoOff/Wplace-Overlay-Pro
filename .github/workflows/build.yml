name: Build
on:
  workflow_dispatch:
  push:
    branches:
      - '**'
      - '!no-build-**'

jobs:
  build:
    name: Build & Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  

      - name: Declare Version Variables
        id: ref
        run: |
          echo "version=$(cat VERSION | xargs)" >> $GITHUB_OUTPUT
          echo "hash=$(git rev-parse --short "$GITHUB_SHA")" >> $GITHUB_OUTPUT

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm build

      - name: Commit dist to current branch
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          
          CURRENT_BRANCH=${GITHUB_REF_NAME}
          
          mkdir -p dist
          git add -f dist/overlay-pro-tt.user.js  
          git commit -m "update userscript for $GITHUB_SHA" || echo "no changes"
          git push origin HEAD:$CURRENT_BRANCH

      - name: Update Development Release
        uses: andelf/nightly-release@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: development
          name: 'Development Release'
          body: Development release for commit ${{ github.sha }}.
          files: |
            dist/overlay-pro-tt.user.js
